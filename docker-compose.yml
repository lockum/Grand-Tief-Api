services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vicewire-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_PATH=/app/data/gta_news.db
      - POLL_INTERVAL_MINUTES=15
      - DEBUG=False
    volumes:
      - vicewire_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  vicewire_data:
    driver: local

